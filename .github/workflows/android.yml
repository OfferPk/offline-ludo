name: Android build

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write   # needed to create a GitHub Release on v* tags

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Install dependencies
        run: npm ci

      - name: Tests (moves, captures, safe squares, exact home, triple 6, rule toggles, AI, 1000 AI-vs-AI games, ad pacing)
        run: npm test

      - name: Capacitor sync
        run: npx cap sync android

      - name: Decode upload keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::warning::KEYSTORE_BASE64 secret not set - building an UNSIGNED release"
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.jks"
          echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"

      - name: Build signed release AAB + APK
        working-directory: android
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon bundleRelease assembleRelease

      - name: Collect outputs
        id: out
        run: |
          VERSION=$(grep -oP 'versionName "\K[^"]+' android/app/build.gradle)
          mkdir -p dist
          cp android/app/build/outputs/bundle/release/app-release.aab "dist/offline-ludo-v$VERSION.aab"
          APK=$(ls android/app/build/outputs/apk/release/*.apk | head -1)
          cp "$APK" "dist/offline-ludo-v$VERSION.apk"
          ls -la dist
          BT="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)"
          "$BT/aapt2" dump badging dist/*.apk | grep -iE "^package:|sdkversion"
          if [ -n "$ANDROID_KEYSTORE_FILE" ]; then
            "$BT/apksigner" verify --print-certs dist/*.apk | head -5
            jarsigner -verify dist/*.aab | grep -E "jar verified|unsigned"
          fi
          rm -f "$RUNNER_TEMP/upload.jks"

      - uses: actions/upload-artifact@v7
        with:
          name: offline-ludo-aab
          path: dist/*.aab
          if-no-files-found: error

      - uses: actions/upload-artifact@v7
        with:
          name: offline-ludo-apk
          path: dist/*.apk
          if-no-files-found: error

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          name: Crossfour Offline Ludo ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            dist/*.aab
            dist/*.apk
